<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baratie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #1a1a1a;
      color: #e8d5c4;
      font-family: 'Cormorant SC', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #container.visible { opacity: 1; }

    #container img {
      max-width: 420px;
      width: 100%;
    }

    #container p {
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0.22em;
      color: #9b9b9b;
    }

    #verifying {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #9b9b9b;
    }
  </style>
</head>
<body>
  <p id="verifying">Verifying&hellip;</p>

  <div id="container">
    <img src="closed.png" alt="" onerror="this.style.display='none'" />
    <p>Memoix is not accepting reservations.</p>
  </div>

  <script>
    const SUPABASE_PROJECT_URL = "https://nbvtbfnhimishmdhczbu.supabase.co";
    const SUPABASE_ANON_KEY    = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5idnRiZm5oaW1pc2htZGhjemJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3NTY5NDYsImV4cCI6MjA4ODMzMjk0Nn0.3KrhM5VLyqdVgquJw7J5-wWrI-Mau7ZmE21CDyFEdIQ";
    const FUNCTION_URL = `${SUPABASE_PROJECT_URL}/functions/v1/validate-completion`;

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const blob   = params.get("r");

      if (!blob) {
        showClosed();
        return;
      }

      try {
        const res = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ action: "validate", blob }),
        });

        console.log("Status:", res.status);
        const data = await res.json();
        console.log("Data:", JSON.stringify(data));

        if (res.status === 200) {
          window.location.replace(`book.html?r=${encodeURIComponent(blob)}`);
          return;
        }
      } catch (e) {
        console.log("Error:", e);
      }

      showClosed();
    }

    function showClosed() {
      document.getElementById("verifying").style.display = "none";
      const c = document.getElementById("container");
      c.style.display = "flex";
      requestAnimationFrame(() => c.classList.add("visible"));
    }

    init();
  </script>
</body>
</html>
